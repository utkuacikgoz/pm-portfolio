version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      # These packages are a peer-dependent pair used only to regenerate the
      # checked-in avatars. Keeping their updates in one PR prevents npm from
      # resolving one against a stale version of the other during deployment.
      dicebear:
        patterns:
          - "@dicebear/*"
        update-types:
          - "minor"
          - "patch"
      # Group the low-risk minor/patch bumps into one PR to cut noise.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # @dicebear/pixel-art has no v10 and pins `@dicebear/core@^9`, so a core
      # major is unresolvable however the PRs are grouped: it fails `npm ci`
      # with ERESOLVE (this is what killed PR #52). Drop this ignore once
      # pixel-art ships a matching major.
      - dependency-name: "@dicebear/core"
        update-types: ["version-update:semver-major"]
      # Pinned deliberately (see CLAUDE.md): Vite 8 / plugin-react 6 target the
      # unreleased rolldown build and break the toolchain. Bump manually.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # The lint/test toolchain is version-interlocked (eslint 9 ↔ its plugins ↔
      # typescript-eslint ↔ vitest). A solo major bump breaks peer resolution —
      # e.g. @eslint/js 10 requires eslint 10 and fails `npm install`. Upgrade
      # these together by hand; let Dependabot handle only their minors/patches.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-react-hooks"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-react-refresh"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript-eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      # React 19.3 is held (Utku's call, 2026-10-08): it adds 8.7 KB gzip to the
      # modulepreloaded react chunk every visitor downloads, flat path included,
      # for ViewTransition / Fragment-ref code we do not use. Revisit when we
      # need a 19.3 feature or a fix. r3f 9.8 also accepts 19.2, so it is free
      # to update on its own.
      - dependency-name: "react"
        versions: [">=19.3.0"]
      - dependency-name: "react-dom"
        versions: [">=19.3.0"]
      - dependency-name: "typescript"
        # TS majors are gated by typescript-eslint's peer range (currently
        # <6.1.0); adopt a new TS major only when the eslint toolchain supports it.
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
