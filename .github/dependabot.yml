version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      # Group the low-risk minor/patch bumps into one PR to cut noise.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Pinned deliberately (see CLAUDE.md): Vite 8 / plugin-react 6 target the
      # unreleased rolldown build and break the toolchain. Bump manually.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # The lint/test toolchain is version-interlocked (eslint 9 ↔ its plugins ↔
      # typescript-eslint ↔ vitest). A solo major bump breaks peer resolution —
      # e.g. @eslint/js 10 requires eslint 10 and fails `npm install`. Upgrade
      # these together by hand; let Dependabot handle only their minors/patches.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-react-hooks"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-react-refresh"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript-eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
