name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match package.json engines (^20.19 || >=22.12); Vite 7 needs it.
          node-version: "20.x"
          cache: npm
      - run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Type check (tsc)
        run: npm run typecheck
      - name: Test + coverage (vitest)
        run: npm run coverage
      - name: Build (vite)
        run: npm run build
      - name: Dependency audit (high+)
        # Low/moderate dev-only advisories (esbuild dev-server, Windows-only) are
        # accepted per CLAUDE.md; fail only on high/critical. Runtime deps are clean.
        run: npm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan full history, not just the tip
      - name: Install gitleaks
        run: |
          VERSION=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gl.tgz
          tar -xzf gl.tgz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Scan (repo + history)
        run: gitleaks detect --redact --exit-code 1
