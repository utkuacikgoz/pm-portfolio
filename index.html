<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/utku-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05060a" />
    <meta name="author" content="Utku Acikgoz" />
    <meta data-seo="robots" name="robots" content="noindex, follow" />

    <!-- Tags carrying data-seo are rewritten per route at build time by
         scripts/vite-seo.ts, and kept in sync on client-side navigation by
         src/seo/useSeo.ts. Keep each one on a single line. -->
    <link data-seo="canonical" rel="canonical" href="https://utkuacikgoz.com/" />
    <title data-seo="title">Utku Acikgoz, Senior Technical Product Manager</title>
    <meta data-seo="description" name="description" content="Senior product manager, 8+ years across fintech, blockchain, HRtech and SaaS, 11 products shipped. Explore the work as an interactive world, or skip to the resume." />

    <!-- Open Graph / social previews (so shared links don't render blank) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Utku Acikgoz" />
    <meta property="og:locale" content="en_US" />
    <meta data-seo="og:url" property="og:url" content="https://utkuacikgoz.com/" />
    <meta data-seo="og:title" property="og:title" content="Utku Acikgoz, Senior Technical Product Manager" />
    <meta data-seo="og:description" property="og:description" content="8+ years across fintech, blockchain, HRtech and SaaS. 11 products shipped. Explore the work as an interactive world." />
    <meta property="og:image" content="https://utkuacikgoz.com/og-image.png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:alt" content="Utku Acikgoz, Senior Technical Product Manager" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta data-seo="twitter:title" name="twitter:title" content="Utku Acikgoz, Senior Technical Product Manager" />
    <meta data-seo="twitter:description" name="twitter:description" content="8+ years across fintech, blockchain, HRtech and SaaS. 11 products shipped." />
    <meta name="twitter:image" content="https://utkuacikgoz.com/og-image.png" />

    <!-- Self-hosted (see src/index.css). Preloaded so the fetch starts with the
         HTML parse rather than waiting for the CSS to resolve. -->
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Structured data: replaced per route (Person + WebSite here, CreativeWork
         and breadcrumbs on a case study). -->
    <script data-seo="route-jsonld" type="application/ld+json">[{"@context":"https://schema.org","@type":"Person","name":"Utku Acikgoz","jobTitle":"Senior Technical Product Manager","url":"https://utkuacikgoz.com","email":"hello@utkuacikgoz.com","sameAs":["https://linkedin.com/in/utkuacikgoz"]}]</script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Crawlable / no-JS fallback so the page isn't empty without the SPA.
         Paragraphs between the markers are replaced per route at build time. -->
    <noscript>
      <main style="max-width:720px;margin:40px auto;padding:0 20px;font-family:sans-serif;color:#111">
        <!--seo:summary-start-->
        <h1>Utku Acikgoz, Senior Technical Product Manager</h1>
        <p>8+ years across fintech, blockchain, HRtech and SaaS. 11 products shipped.</p>
        <!--seo:summary-end-->
        <p>
          <a href="/resume">Resume</a> ·
          <a href="mailto:hello@utkuacikgoz.com">hello@utkuacikgoz.com</a> ·
          <a href="https://linkedin.com/in/utkuacikgoz">LinkedIn</a>
        </p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
